name: Android CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: GitHub Actions runner label used for Android jobs.
        required: false
        type: string
        default: ubuntu-latest
      java-version:
        description: Java version used for Gradle and Android builds.
        required: false
        type: string
        # renovate: datasource=java-version depName=java extractVersion=^(?<version>\d+)
        default: '17'
      java-distribution:
        description: Java distribution passed to actions/setup-java.
        required: false
        type: string
        default: temurin
      gradle-version:
        description: Gradle version installed before generating or running the wrapper.
        required: false
        type: string
        default: ''
      gradle-wrapper-command:
        description: Gradle wrapper generation command. Set to an empty string when the wrapper is checked in and should not be generated.
        required: false
        type: string
        default: gradle :wrapper
      build-command:
        description: Build validation command. Set to an empty string to skip the build step.
        required: false
        type: string
        default: ./gradlew :app:assembleDebug --stacktrace
      build-artifact-name:
        description: Name for the optional build artifact upload.
        required: false
        type: string
        default: android-debug-apk
      build-artifact-path:
        description: Path to upload after the build command. Set to an empty string to skip artifact upload.
        required: false
        type: string
        default: app/build/outputs/apk/debug/*.apk
      lint-command:
        description: Android lint command. Set to an empty string to skip the lint step.
        required: false
        type: string
        default: ./gradlew :app:lintDebug --stacktrace
      unit-test-command:
        description: JVM unit and Robolectric test command.
        required: false
        type: string
        default: ./gradlew :app:testDebugUnitTest --stacktrace
      instrumented-test-command:
        description: Instrumented test command run inside the Android emulator. Required to enable the instrumented-tests job.
        required: false
        type: string
        default: ''
      instrumented-test-api-level:
        description: Android API level used by the instrumented test emulator.
        required: false
        type: number
        # renovate: datasource=custom.android-api-level depName=android-api-level versioning=docker
        default: 35
      instrumented-test-arch:
        description: Android emulator CPU architecture used for instrumented tests.
        required: false
        type: string
        default: x86_64
      instrumented-test-artifact-name:
        description: Name for the optional instrumented test artifact upload.
        required: false
        type: string
        default: instrumented-test-artifacts
      instrumented-test-artifact-path:
        description: Path to upload after instrumented tests. Set to an empty string to skip artifact upload.
        required: false
        type: string
        default: ''
      concurrency-group:
        description: Concurrency group this call joins. Set to an empty string to derive one from this workflow and the caller's ref.
        required: false
        type: string
        default: ''
      concurrency-cancel-in-progress:
        description: Whether joining the concurrency group cancels a run already in it.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Named after this workflow rather than `github.workflow`, which resolves to the *caller's*
  # workflow name inside a called workflow. A caller grouping on `${{ github.workflow }}-${{ github.ref }}`
  # would land in this same group and cancel itself the moment the call started. Group names are
  # case insensitive, so a bare `ci-` prefix would collide with a caller workflow named `CI` too.
  #
  # `github.ref` is the caller's ref, and one group per ref is what supersedes an outdated run.
  # Prefer it over `github.event.pull_request.number`: `github.event` was empty at this evaluation
  # site in a called workflow until 2026, whereas `github.ref` has always resolved here.
  group: ${{ inputs.concurrency-group || format('android-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.concurrency-cancel-in-progress }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ inputs.gradle-version }}

      - name: Generate Gradle wrapper
        if: ${{ inputs.gradle-wrapper-command != '' }}
        run: ${{ inputs.gradle-wrapper-command }}

      - name: Build validation
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}

      - name: Upload build artifact
        if: ${{ inputs.build-command != '' && inputs.build-artifact-path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.build-artifact-name }}
          path: ${{ inputs.build-artifact-path }}
          if-no-files-found: error

  lint:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ inputs.gradle-version }}

      - name: Generate Gradle wrapper
        if: ${{ inputs.gradle-wrapper-command != '' }}
        run: ${{ inputs.gradle-wrapper-command }}

      - name: Android lint
        if: ${{ inputs.lint-command != '' }}
        run: ${{ inputs.lint-command }}

  unit-tests:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ inputs.gradle-version }}

      - name: Generate Gradle wrapper
        if: ${{ inputs.gradle-wrapper-command != '' }}
        run: ${{ inputs.gradle-wrapper-command }}

      - name: JVM unit and Robolectric tests
        run: ${{ inputs.unit-test-command }}

  instrumented-tests:
    if: ${{ inputs.instrumented-test-command != '' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: ${{ inputs.gradle-version }}

      - name: Generate Gradle wrapper
        if: ${{ inputs.gradle-wrapper-command != '' }}
        run: ${{ inputs.gradle-wrapper-command }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ inputs.instrumented-test-api-level }}
          arch: ${{ inputs.instrumented-test-arch }}
          script: ${{ inputs.instrumented-test-command }}

      - name: Upload instrumented test artifacts
        if: ${{ always() && inputs.instrumented-test-artifact-path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.instrumented-test-artifact-name }}
          path: ${{ inputs.instrumented-test-artifact-path }}
          if-no-files-found: warn
