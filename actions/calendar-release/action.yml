name: Calendar Release

description: Create a GitHub Release with generated notes for a calendar tag.

inputs:
  tag:
    description: Release tag to create.
    required: true
  title:
    description: Release title. Defaults to the tag.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Create GitHub Release
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_TITLE: ${{ inputs.title }}
      run: |
        set -euo pipefail

        title="${RELEASE_TITLE}"
        if [ -z "${title}" ]; then
          title="${RELEASE_TAG}"
        fi

        gh release create "${RELEASE_TAG}" \
          --title "${title}" \
          --generate-notes \
          --fail-on-no-commits
