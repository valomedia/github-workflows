name: Calendar Release

description: Create a GitHub Release with generated notes for a calendar tag.

inputs:
  tag:
    description: Release tag to create.
    required: true
  title:
    description: Release title. Defaults to the tag.
    required: false
    default: ''
  target-sha:
    description: Commit SHA the release tag must target.
    required: true

runs:
  using: composite
  steps:
    - name: Create GitHub Release
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_TITLE: ${{ inputs.title }}
        TARGET_SHA: ${{ inputs.target-sha }}
      run: |
        set -euo pipefail

        title="${RELEASE_TITLE}"
        if [ -z "${title}" ]; then
          title="${RELEASE_TAG}"
        fi

        if [ -z "${TARGET_SHA}" ]; then
          echo "::error::target-sha is required."
          exit 1
        fi

        gh release create "${RELEASE_TAG}" \
          --target "${TARGET_SHA}" \
          --title "${title}" \
          --generate-notes \
          --fail-on-no-commits
