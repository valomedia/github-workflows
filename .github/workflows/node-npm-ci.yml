name: Node/npm CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used for build, lint, and test jobs.
        required: false
        type: string
        # renovate: datasource=node-version depName=node versioning=node
        default: '24'
      build-command:
        description: Build command. Set to an empty string to skip the build step.
        required: false
        type: string
        default: npm run build
      build-artifact-name:
        description: Name of the optional build artifacts, before their .zip and .tar.gz extensions.
        required: false
        type: string
        default: node-build
      build-artifact-path:
        description: Directory to upload as a ZIP and a tar.gz artifact after the build command. Set to an empty string to skip artifact upload.
        required: false
        type: string
        default: ''
      lint-command:
        description: Lint command. Set to an empty string to skip the lint step.
        required: false
        type: string
        default: npm run lint
      unit-test-command:
        description: Unit test command.
        required: false
        type: string
        default: NODE_ENV=test npm run test
      integration-test-command:
        description: Integration test command. Required to enable the integration-tests job.
        required: false
        type: string
        default: ''
      integration-install-command:
        description: Optional install command to run before integration tests, such as Playwright browser installation.
        required: false
        type: string
        default: ''
      concurrency-group:
        description: Concurrency group this call joins. Set to an empty string to derive one from this workflow and the caller's ref.
        required: false
        type: string
        default: ''
      concurrency-cancel-in-progress:
        description: Whether joining the concurrency group cancels a run already in it.
        required: false
        type: boolean
        default: true

concurrency:
  # Named after this workflow rather than `github.workflow`, which resolves to the *caller's*
  # workflow name inside a called workflow. A caller grouping on `${{ github.workflow }}-${{ github.ref }}`
  # would land in this same group and cancel itself the moment the call started. Group names are
  # case insensitive, so a bare `ci-` prefix would collide with a caller workflow named `CI` too.
  #
  # `github.ref` is the caller's ref, and one group per ref is what supersedes an outdated run.
  # Prefer it over `github.event.pull_request.number`: `github.event` was empty at this evaluation
  # site in a called workflow until 2026, whereas `github.ref` has always resolved here.
  group: ${{ inputs.concurrency-group || format('node-npm-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.concurrency-cancel-in-progress }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}

      - name: Archive build output
        if: ${{ inputs.build-command != '' && inputs.build-artifact-path != '' }}
        env:
          BUILD_ARTIFACT_NAME: ${{ inputs.build-artifact-name }}
          BUILD_ARTIFACT_PATH: ${{ inputs.build-artifact-path }}
        run: |
          if [[ ! "$BUILD_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::build-artifact-name must start with a letter or digit and contain only letters, digits, dots, underscores, and hyphens."
            exit 1
          fi

          build_directory="$(realpath -m -- "$BUILD_ARTIFACT_PATH")"
          if [[ ! -d "$build_directory" || "$build_directory" != "$GITHUB_WORKSPACE/"* ]]; then
            echo "::error::build-artifact-path must be a directory inside the workspace, not the workspace itself."
            exit 1
          fi

          # Archive from the parent, so each archive holds the directory under its own name.
          cd -- "$(dirname -- "$build_directory")"
          directory_name="$(basename -- "$build_directory")"
          zip -q -r -y "$RUNNER_TEMP/$BUILD_ARTIFACT_NAME.zip" "$directory_name"
          tar -czf "$RUNNER_TEMP/$BUILD_ARTIFACT_NAME.tar.gz" "$directory_name"

      # With `archive: false`, the action uploads one file as is and names the artifact after it.
      - name: Upload build ZIP
        if: ${{ inputs.build-command != '' && inputs.build-artifact-path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/${{ inputs.build-artifact-name }}.zip
          archive: false
          if-no-files-found: error

      - name: Upload build tar.gz
        if: ${{ inputs.build-command != '' && inputs.build-artifact-path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/${{ inputs.build-artifact-name }}.tar.gz
          archive: false
          if-no-files-found: error

  lint:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        if: ${{ inputs.lint-command != '' }}
        run: ${{ inputs.lint-command }}

  unit-tests:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Unit tests
        run: ${{ inputs.unit-test-command }}

  integration-tests:
    if: ${{ inputs.integration-test-command != '' }}
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install integration test dependencies
        if: ${{ inputs.integration-install-command != '' }}
        run: ${{ inputs.integration-install-command }}

      - name: Integration tests
        run: ${{ inputs.integration-test-command }}
